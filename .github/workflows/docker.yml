# Builds the web app's container image and publishes it to GitHub's registry (ghcr.io).
# The Hugging Face Space in deploy/huggingface/ runs this image.
name: Build container image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, "dashboard/**", "experiments/**", .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kartikeya2046/climate-aware-load-forecasting:latest
